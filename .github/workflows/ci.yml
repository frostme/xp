name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run ci
  database:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mysql, mssql, mongodb]
    env:
      XP_DATABASE: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: docker compose -f docker-compose.test.yml up -d --wait $XP_DATABASE
      - run: bun run test:integration
      - if: always()
        run: docker compose -f docker-compose.test.yml logs
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v
