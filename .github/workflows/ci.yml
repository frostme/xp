name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --global pnpm@12.14.0 yarn@1.22.22
      - run: bun run ci
  transports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:transports --reporter=verbose
      - run: bun run build
      - run: bun run test:hosts
  protocol-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run build && bun run test:protocol-browser
  frontend-matrix:
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.matrix.outputs.profiles }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - id: matrix
        run: echo "profiles=$(node scripts/test-frontend.mjs --matrix)" >> "$GITHUB_OUTPUT"
      - run: bun run build && mkdir -p /tmp/packed && bun pm pack --ignore-scripts --destination /tmp/packed
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-package
          path: /tmp/packed/*.tgz

  frontend:
    needs: frontend-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.frontend-matrix.outputs.profiles) }}
    env:
      XP_PROFILE: ${{ matrix.profile }}
      XP_TRACE_DIR: frontend-traces
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: frontend-package
          path: packed
      - run: XP_TARBALL="$(realpath packed/*.tgz)" bun run test:frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-trace-${{ matrix.profile }}
          path: frontend-traces/

  database:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mysql, mssql, mongodb, dynamodb]
    env:
      XP_DATABASE: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: docker compose -f docker-compose.test.yml up -d --wait $XP_DATABASE
      - run: bun run test:integration
      - name: Installed React journey over Express, Yoga and Apollo
        if: matrix.database == 'postgres'
        run: bun run build && bun run test:journey
      - name: Installed frontend journeys in Chromium and PostgreSQL
        if: matrix.database == 'postgres'
        env:
          XP_TRACE_DIR: frontend-db-traces
        run: |
          bunx playwright install --with-deps chromium
          bun run test:frontend:journey
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.database == 'postgres'
        with:
          name: frontend-db-traces
          path: frontend-db-traces/
      - if: always()
        run: docker compose -f docker-compose.test.yml logs
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v
