services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports: ["127.0.0.1:5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 2s
      timeout: 5s
      retries: 30
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: test_db
    ports: ["127.0.0.1:3307:3306"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h127.0.0.1 -uroot -proot_password -e 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 60
  mssql:
    # SQL Server 2025; native amd64 CI is authoritative (ARM emulation is unsupported).
    image: mcr.microsoft.com/mssql/server@sha256:245f6b1c8903edae52cb20fa31419cefcde1a49938bb8c3447099011fc871ca3
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Xp_test_Password123!
    ports: ["127.0.0.1:1434:1433"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C -b || exit 1',
        ]
      interval: 3s
      timeout: 10s
      retries: 60
      start_period: 20s
  mongodb:
    # MongoDB 9, single-node replica set for integration transactions.
    image: mongo@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27018:27017"]
    tmpfs: [/data/db]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { if (db.hello().isWritablePrimary) quit(0); try { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}); } catch {} quit(1); } catch { quit(1); }"
      interval: 2s
      timeout: 10s
      retries: 60
  dynamodb:
    image: amazon/dynamodb-local@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/"]
      interval: 2s
      timeout: 5s
      retries: 60
