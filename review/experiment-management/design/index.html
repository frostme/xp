<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Experiment decisions</title>
    <link rel="stylesheet" href="decision.css" />
  </head>
  <body>
    <a class="skip" href="#content" id="skip">Skip to experiment</a>
    <nav aria-label="Breadcrumb">
      <a href="#" aria-label="Experiment directory"><strong>xp</strong> Experiments</a
      ><span id="crumb"></span><span id="access"></span>
    </nav>
    <main id="content" tabindex="-1"></main>
    <div id="status" role="status" aria-atomic="true"></div>
    <dialog aria-labelledby="review-title">
      <form method="dialog">
        <div id="review"></div>
        <p id="problem" role="alert"></p>
        <div class="actions">
          <button value="cancel">Back</button
          ><button type="button" class="primary" id="commit"></button>
        </div>
      </form>
    </dialog>
    <script src="decision.js"></script>
  </body>
</html>
