<!doctype html>

  <style>
    body {
      margin: 0;
      background: #f9fbf9;
      color: #18292e;
      font: 14px/1.5 system-ui;
    }
    main {
      max-width: 1040px;
      margin: auto;
    }
    section {
      display: none;
      position: relative;
    }
    section:target,
    body:not(:has(section:target)) #directory {
      display: block;
    }
    section img {
      display: block;
      max-width: 100%;
      height: auto;
    }
    section a {
      position: absolute;
      border-radius: 4px;
    }
    section a:focus-visible {
      outline: 4px solid #385cf0;
      outline-offset: 3px;
    }
    nav {
      margin: auto;
      padding: 14px 20px;
      max-width: 1000px;
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      align-items: center;
      border-bottom: 1px solid #c9d4d4;
    }
    nav a {
      color: inherit;
    }
